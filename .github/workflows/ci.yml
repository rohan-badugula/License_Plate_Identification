name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      YOLO_CONFIG_DIR: /tmp/alpr-yolo
      MPLCONFIGDIR: /tmp/alpr-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,legacy]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - run: python -m build
      - run: alpr --help
