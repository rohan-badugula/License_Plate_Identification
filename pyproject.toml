[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-alpr"
version = "0.1.0"
description = "Reproducible YOLOv8 and EfficientNet-B7 license plate recognition"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Rohan Reddy B"}]
dependencies = [
  "numpy>=1.26,<3", "Pillow>=10,<13", "opencv-python>=4.10,<5",
  "torch>=2.6,<3", "torchvision>=0.21,<1", "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
alpr = "alpr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: real neural model smoke tests (no downloads)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
